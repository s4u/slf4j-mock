# Presence of this file enables Sonar analysis in s4u/.github workflows
# Used directly for analysis of pull requests from forks by maven-sonar-pr.yml
# Should be consistent with sonar-maven-plugin analysis
sonar.projectKey=org.simplify4u:slf4j-mock-parent
sonar.projectName=SLF4J mock
sonar.sources=pom.xml,\
  slf4j-mock-common/src/main/java,\
  slf4j-mock/src/main/java,\
  slf4j2-mock/src/main/java
sonar.tests=slf4j-mock-common/src/test/java,\
  slf4j-mock/src/test/java,\
  slf4j2-mock/src/test/java,\
  slf4j-mock-tests/src/test/java
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/slf4jmock/SimpleLogger.java
